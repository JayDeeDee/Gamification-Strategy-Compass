<html>
<head>

  <title>Gamification Strategy Compass</title>

  <script src="js/anychart-base.min.js"></script>
  <script src="js/anychart-sunburst.min.js"></script>
  <script src="js/anychart-ui.min.js"></script>
  <script src="js/anychart-exports.min.js"></script>
  <script src="js/anychart-data-adapter.min.js"></script>

  <link href="css/anychart-ui.min.css" type="text/css" rel="stylesheet">
  <style type="text/css">
    html,
    body,
    #container {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: Verdana, Helvetica, Arial, sans-serif;
    }
    #overlay {
      position: fixed;
      z-index: 90000;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
    }

    #overlay-content {
      position: relative;
      z-index: 1;
      top: 25vh;
      width: 50%;
      max-height: 71vh;
      text-align: center;
      margin-left: auto;
      margin-right: auto;
      padding: 2vw;
      background-color: #fff;
    }
    #overlay-close {
      position: absolute;
      display: block;
      z-index: 2;
      right: 25vw;
      top: 27vh;
      width: 1.5rem;
      height: 1.5rem;
      text-align: center;
      padding-top: 0.25rem;
      color: #000000;
      font-weight: bold;
      text-decoration: none;
      border: 1px solid #000;
    }

    #overlay-close:hover,
    #overlay-close:focus,
    #overlay-close:active {
      color: #fff;
      background: #000;
    }

    #overlay.hide {
      display: none;
    }

    #overlay-content ul {
      text-align: left;
      margin-left: 20px;
      padding-left: 0;
    }
    #overlay-content p{
      text-align: left;
    }
    #overlay-content a{
      color: #4D7796;
    }

    #overlay-content a:hover,
    #overlay-content a:focus {
      color: #2F485B;
    }

    body {
      /*height: 200%;*/
    }
  </style>
</head>
<body>
  <div id="container"></div>D
  <div id="overlay" class="hide"><a href="#container" title="close" id="overlay-close">x</a><div id="overlay-content"></div></div>D

  <script>
    // Close the overlay when the close button is clicked.
    document.getElementById('overlay-close').addEventListener('click', function (e) {
      e.preventDefault();
      document.getElementById('overlay').classList.add('hide');
      document.getElementById('overlay-content').innerHTML = "";
    });

    anychart.onDocumentReady(function () {
      anychart.data.loadJsonFile(
              'data/data.json',
              function (data) {
                // Only root (depth 0) and first level (depth 1) are visible initially.
                const INITIAL_VISIBLE_DEPTH = 1;

                // Stores the currently expanded first-level branch only.
                const expandedNodes = {};

                const rowsById = {};
                const childIdsById = {};

                let chart = null;

                data.forEach(function (row) {
                  rowsById[row.id] = row;
                  childIdsById[row.id] = childIdsById[row.id] || [];
                });

                data.forEach(function (row) {
                  if (row.parent) {
                    childIdsById[row.parent] = childIdsById[row.parent] || [];
                    childIdsById[row.parent].push(row.id);
                  }
                });

                function annotateDepth(id, depth) {
                  const row = rowsById[id];
                  if (!row) return;

                  row._depth = depth;

                  (childIdsById[id] || []).forEach(function (childId) {
                    annotateDepth(childId, depth + 1);
                  });
                }

                data.forEach(function (row) {
                  if (!row.parent) {
                    annotateDepth(row.id, 0);
                  }
                });

                function nearestExpandableAncestorId(row) {
                  let current = row;

                  while (current && current._depth > INITIAL_VISIBLE_DEPTH) {
                    current = rowsById[current.parent];
                  }

                  return current ? current.id : null;
                }

                function isVisible(row) {
                  if (row._depth <= INITIAL_VISIBLE_DEPTH) return true;

                  const expandableAncestorId = nearestExpandableAncestorId(row);
                  return !!expandedNodes[expandableAncestorId];
                }

                function buildVisibleRows() {
                  return data
                          .filter(isVisible)
                          .map(function (row) {
                            return Object.assign({}, row);
                          });
                }

                function showOverlay(node) {
                  let name = node.get('name');
                  let desc = node.get('description');
                  let guidance = node.get('level-of-guidance');
                  let focus = node.get('focus');
                  let background = node.get('background');
                  let personalization = node.get('level-of-personalization');
                  let evaluation = node.get('evaluation');
                  let link = node.get('link');

                  let markup = '';
                  markup += name ? '<h2>' + name + '</h2>' : '';

                  if (link) {
                    markup += '<p><a target="_blank" href="' + link + '">Learn more</a></p>';
                  }

                  markup += desc ? '<p>' + desc + '</p>' : '';

                  if (guidance || focus || background || personalization || evaluation) {
                    markup += '<ul>';
                    markup += guidance ? '<li>Level of Guidance: ' + guidance + '</li>' : '';
                    markup += focus ? '<li>Focus: ' + focus + '</li>' : '';
                    markup += background ? '<li>Background: ' + background + '</li>' : '';
                    markup += personalization ? '<li>Personalization: ' + personalization + '</li>' : '';
                    markup += evaluation ? '<li>Evaluation: ' + evaluation + '</li>' : '';
                    markup += '</ul>';
                  }

                  document.getElementById('overlay-content').innerHTML = markup;
                  document.getElementById('overlay').classList.remove('hide');
                }

                function configureChart(currentChart) {
                  currentChart.title().enabled(true).useHtml(true).text(
                          '<h1 style="font-size:225%; font-weight: bold;">Gamification Strategy Compass<br><span style="font-size: 100%; font-weight: normal">(last modified: 2026-01-04)</span></h1>'
                  );

                  currentChart.calculationMode('ordinal-from-leaves');
                  currentChart.labels().hAlign('center');
                  currentChart.palette(['#0288d1', '#d4e157', '#ff6e40', '#f8bbd0']);

                  currentChart.fill(function () {
                    return this.parent
                            ? anychart.color.darken(this.parentColor, 0.15)
                            : this.mainColor;
                  });

                  // Disable point selection via interactivity API.
                  currentChart.interactivity().selectionMode('none');

                  let tooltip = currentChart.tooltip();
                  tooltip.useHtml(true);
                  tooltip.format(
                          '<h5 style="font-size:14px; font-weight: 800; margin: 0.25rem 0; width: 400px; max-width: 50vw; border-bottom: 1px solid rgba(255,255,255,.5)">{%name}</h5><p style="font-size:12px; font-weight:200; width: 400px; max-width: 50vw; margin: 0.8rem 0 0.2rem;"><b>{%description}</b></p>'
                  );
                }

                function refreshChart(drillToId) {
                  const visibleTree = anychart.data.tree(buildVisibleRows(), 'as-table');
                  chart.data(visibleTree);
                  chart.draw();

                  if (drillToId) {
                    try {
                      chart.drillTo(drillToId);
                    } catch (err) {
                      console.warn('drillTo failed for', drillToId, err);
                    }
                  }
                }

                // Keep only one branch expanded at a time.
                function expandOnly(clickedId) {
                  Object.keys(expandedNodes).forEach(function (key) {
                    delete expandedNodes[key];
                  });
                  expandedNodes[clickedId] = true;
                }

                chart = anychart.sunburst(anychart.data.tree(buildVisibleRows(), 'as-table'));
                configureChart(chart);

                chart.listen('pointClick', function (e) {
                  let point = e.point || null;
                  let visibleNode = point ? point.getNode() : null;
                  if (!visibleNode) return;

                  let clickedId = visibleNode.get('id');
                  let fullNode = rowsById[clickedId];
                  let hasChildrenInFullData = !!((childIdsById[clickedId] || []).length);
                  let isVisibleLeaf = visibleNode.numChildren() === 0;
                  let depth = fullNode ? fullNode._depth : 0;

                  // Open only the clicked branch and collapse all others.
                  if (hasChildrenInFullData && isVisibleLeaf && depth >= INITIAL_VISIBLE_DEPTH) {
                    if (typeof e.preventDefault === 'function') {
                      e.preventDefault();
                    }

                    expandOnly(clickedId);
                    refreshChart(clickedId);
                    return;
                  }

                  // Show overlay for true leaves.
                  if (!hasChildrenInFullData) {
                    if (typeof e.preventDefault === 'function') {
                      e.preventDefault();
                    }

                    showOverlay(visibleNode);
                  }
                });

                chart.container('container');
                chart.draw();
              }
      );
    });
  </script>
</body>
</html>
